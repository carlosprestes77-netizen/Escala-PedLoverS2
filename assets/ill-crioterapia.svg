<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustração de crioterapia e banheira de gelo">
  <defs>
    <linearGradient id="crBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f5049"/>
      <stop offset="1" stop-color="#082623"/>
    </linearGradient>
    <linearGradient id="crWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb7e8"/>
      <stop offset="1" stop-color="#3B5BAD"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#crBg)"/>
  <circle cx="610" cy="150" r="180" fill="#1ba883" opacity="0.18"/>
  <!-- ice tub -->
  <g>
    <rect x="210" y="250" width="380" height="270" rx="34" fill="#082623" stroke="#1ba883" stroke-width="4"/>
    <rect x="232" y="278" width="336" height="210" rx="22" fill="url(#crWater)" opacity="0.9"/>
    <!-- floating ice cubes -->
    <g fill="#F3F6F1" opacity="0.92">
      <rect x="268" y="300" width="34" height="30" rx="6" transform="rotate(-8 285 315)"/>
      <rect x="330" y="292" width="40" height="34" rx="6" transform="rotate(6 350 309)"/>
      <rect x="410" y="302" width="30" height="28" rx="6" transform="rotate(-4 425 316)"/>
      <rect x="470" y="296" width="38" height="32" rx="6" transform="rotate(10 489 312)"/>
    </g>
    <!-- person shoulders/head immersed -->
    <g fill="#F3F6F1" opacity="0.16">
      <circle cx="400" cy="220" r="46"/>
      <path d="M330 300 c0 -50 30 -84 70 -84 c40 0 70 34 70 84 z"/>
    </g>
    <!-- water ripples -->
    <g fill="none" stroke="#F3F6F1" stroke-width="2" opacity="0.4">
      <path d="M250 360 q30 -10 60 0 t60 0 t60 0 t60 0"/>
      <path d="M250 400 q30 -10 60 0 t60 0 t60 0 t60 0" opacity="0.6"/>
    </g>
  </g>
  <!-- snowflakes -->
  <g stroke="#C5D62C" stroke-width="3" stroke-linecap="round">
    <g transform="translate(150 160)"><line x1="-16" y1="0" x2="16" y2="0"/><line x1="0" y1="-16" x2="0" y2="16"/><line x1="-11" y1="-11" x2="11" y2="11"/><line x1="-11" y1="11" x2="11" y2="-11"/></g>
    <g transform="translate(660 330) scale(0.8)"><line x1="-16" y1="0" x2="16" y2="0"/><line x1="0" y1="-16" x2="0" y2="16"/><line x1="-11" y1="-11" x2="11" y2="11"/><line x1="-11" y1="11" x2="11" y2="-11"/></g>
    <g transform="translate(120 380) scale(0.65)"><line x1="-16" y1="0" x2="16" y2="0"/><line x1="0" y1="-16" x2="0" y2="16"/><line x1="-11" y1="-11" x2="11" y2="11"/><line x1="-11" y1="11" x2="11" y2="-11"/></g>
  </g>
</svg>
