<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustração de liberação miofascial">
  <defs>
    <linearGradient id="myBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5BAD"/>
      <stop offset="1" stop-color="#1c2c5e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#myBg)"/>
  <circle cx="220" cy="160" r="200" fill="#4a6bc0" opacity="0.4"/>
  <circle cx="640" cy="460" r="150" fill="#C5D62C" opacity="0.10"/>
  <!-- muscle / leg form -->
  <path d="M120 470 C 220 430 300 420 420 380 C 540 340 640 300 700 230 C 720 205 705 175 675 185 C 590 215 520 270 410 305 C 300 340 210 360 130 410 C 100 428 95 460 120 470 Z"
        fill="#F3F6F1" opacity="0.12"/>
  <!-- fascia strands -->
  <g fill="none" stroke="#C5D62C" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M150 440 C 280 400 420 350 560 280"/>
    <path d="M170 470 C 300 430 440 380 600 300" opacity="0.6"/>
    <path d="M150 410 C 270 375 410 325 540 260" opacity="0.6"/>
  </g>
  <!-- release glow points -->
  <g fill="#C5D62C">
    <circle cx="360" cy="360" r="7"/><circle cx="470" cy="320" r="6"/><circle cx="250" cy="415" r="6"/>
  </g>
  <g fill="none" stroke="#C5D62C" stroke-width="2" opacity="0.5">
    <circle cx="360" cy="360" r="18"/><circle cx="470" cy="320" r="15"/>
  </g>
  <!-- hands / fingers pressing -->
  <g transform="translate(330 150)" fill="#F3F6F1" stroke="#3B5BAD" stroke-width="3">
    <path d="M0 120 C -10 70 10 30 50 20 C 60 -10 90 -10 100 18 C 130 14 150 40 145 80 C 165 90 165 130 140 150 C 110 175 40 178 10 160 C -8 148 -6 132 0 120 Z"/>
  </g>
  <g transform="translate(330 150)" fill="none" stroke="#3B5BAD" stroke-width="3" stroke-linecap="round">
    <path d="M40 30 l8 -34 M70 22 l4 -40 M100 26 l14 -32"/>
  </g>
</svg>
