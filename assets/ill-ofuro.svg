<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustração de ofurô e terapia termal">
  <defs>
    <linearGradient id="ofBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5BAD"/>
      <stop offset="1" stop-color="#0D4440"/>
    </linearGradient>
    <linearGradient id="ofWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1ba883"/>
      <stop offset="1" stop-color="#0f5049"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ofBg)"/>
  <circle cx="180" cy="170" r="190" fill="#4a6bc0" opacity="0.30"/>
  <!-- steam waves -->
  <g fill="none" stroke="#F3F6F1" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <path d="M330 180 c-18 -22 18 -42 0 -64 c-16 -20 16 -40 0 -60"/>
    <path d="M410 170 c-18 -22 18 -42 0 -64 c-16 -20 16 -40 0 -60" opacity="0.8"/>
    <path d="M490 180 c-18 -22 18 -42 0 -64 c-16 -20 16 -40 0 -60"/>
  </g>
  <!-- round ofuro tub -->
  <g transform="translate(400 380)">
    <ellipse cx="0" cy="20" rx="230" ry="120" fill="#082623" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="220" ry="110" fill="#5a3a22"/>
    <ellipse cx="0" cy="-6" rx="200" ry="96" fill="#7a5230"/>
    <ellipse cx="0" cy="-10" rx="182" ry="84" fill="url(#ofWater)"/>
    <!-- wood staves -->
    <g stroke="#5a3a22" stroke-width="3" opacity="0.7">
      <line x1="-205" y1="0" x2="-185" y2="0"/><line x1="-150" y1="60" x2="-138" y2="50"/>
      <line x1="0" y1="78" x2="0" y2="66"/><line x1="150" y1="60" x2="138" y2="50"/>
      <line x1="205" y1="0" x2="185" y2="0"/>
    </g>
    <!-- warm ripples -->
    <g fill="none" stroke="#C5D62C" stroke-width="2.5" opacity="0.55">
      <ellipse cx="0" cy="-10" rx="60" ry="26"/>
      <ellipse cx="0" cy="-10" rx="110" ry="48" opacity="0.6"/>
    </g>
    <!-- person head/shoulders -->
    <g fill="#F3F6F1" opacity="0.20">
      <circle cx="0" cy="-58" r="34"/>
      <path d="M-52 -16 c0 -34 23 -58 52 -58 c29 0 52 24 52 58 z"/>
    </g>
  </g>
  <!-- warmth glow dots -->
  <g fill="#C5D62C">
    <circle cx="640" cy="200" r="6"/><circle cx="690" cy="260" r="4"/><circle cx="610" cy="280" r="4"/>
  </g>
</svg>
