<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustração de osteopatia e alinhamento da coluna">
  <defs>
    <linearGradient id="osBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D4440"/>
      <stop offset="1" stop-color="#082623"/>
    </linearGradient>
    <linearGradient id="osSpine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C5D62C"/>
      <stop offset="1" stop-color="#1ba883"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#osBg)"/>
  <circle cx="560" cy="180" r="220" fill="#0f5049" opacity="0.45"/>
  <circle cx="180" cy="470" r="160" fill="#1ba883" opacity="0.12"/>
  <!-- back/body silhouette -->
  <path d="M300 90 c-70 0 -120 55 -120 130 c0 60 26 95 26 150 c0 55 -34 90 -34 150 l250 0 c-10 -55 -36 -90 -36 -150 c0 -60 30 -95 30 -160 c0 -78 -50 -120 -110 -120 z"
        fill="#F3F6F1" opacity="0.10"/>
  <!-- spine column -->
  <g transform="translate(300 110)">
    <path d="M0 0 C 4 70 -10 150 6 230 C 16 300 -4 360 8 410" fill="none" stroke="url(#osSpine)" stroke-width="10" stroke-linecap="round"/>
    <g fill="#F3F6F1">
      <ellipse cx="2" cy="40" rx="22" ry="11"/>
      <ellipse cx="-4" cy="90" rx="24" ry="11"/>
      <ellipse cx="4" cy="140" rx="25" ry="12"/>
      <ellipse cx="-2" cy="195" rx="26" ry="12"/>
      <ellipse cx="8" cy="250" rx="25" ry="12"/>
      <ellipse cx="2" cy="305" rx="24" ry="11"/>
      <ellipse cx="6" cy="360" rx="22" ry="11"/>
    </g>
    <g fill="#C5D62C">
      <circle cx="2" cy="40" r="5"/><circle cx="-4" cy="90" r="5"/>
      <circle cx="4" cy="140" r="5"/><circle cx="-2" cy="195" r="5"/>
      <circle cx="8" cy="250" r="5"/><circle cx="2" cy="305" r="5"/>
      <circle cx="6" cy="360" r="5"/>
    </g>
  </g>
  <!-- alignment guide lines -->
  <g stroke="#C5D62C" stroke-width="2" opacity="0.5" stroke-dasharray="2 10" stroke-linecap="round">
    <line x1="470" y1="120" x2="620" y2="120"/>
    <line x1="470" y1="300" x2="660" y2="300"/>
    <line x1="470" y1="470" x2="620" y2="470"/>
  </g>
  <!-- pressing hands hint -->
  <g transform="translate(120 250)" fill="none" stroke="#1ba883" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 0 c30 0 60 18 60 55 c0 30 -22 52 -55 52 c-40 0 -65 -28 -65 -60 c0 -28 22 -47 60 -47 z"/>
    <path d="M22 38 l0 -38 M44 32 l0 -44 M66 38 l0 -36"/>
  </g>
</svg>
